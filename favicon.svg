<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bottleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a6a35"/>
      <stop offset="25%" stop-color="#d4ad6a"/>
      <stop offset="55%" stop-color="#f0d094"/>
      <stop offset="75%" stop-color="#d4ad6a"/>
      <stop offset="100%" stop-color="#7a5a2a"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a0e06"/>
      <stop offset="50%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0e06"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#161616"/>
    </linearGradient>
  </defs>

  <!-- 배경 (둥근 사각, 다크) -->
  <rect width="64" height="64" rx="9" fill="#0a0a0a"/>

  <!-- 양주병 통합 실루엣 (캡→목→어깨→몸통) -->
  <path d="
    M 26 2
    L 38 2
    L 38 10
    L 36 11
    L 36 21
    L 52 28
    L 52 60
    Q 52 62 50 62
    L 14 62
    Q 12 62 12 60
    L 12 28
    L 28 21
    L 28 11
    L 26 10
    Z
  " fill="url(#bottleGrad)" stroke="#5a3a18" stroke-width="0.5"/>

  <!-- 캡 (단독 진한 색) -->
  <rect x="25" y="2" width="14" height="8" rx="1" fill="url(#capGrad)"/>
  <rect x="25" y="8" width="14" height="2" fill="#0a0a0a" opacity="0.5"/>

  <!-- 액체 표면 라인 (위스키 라인) -->
  <line x1="14" y1="34" x2="50" y2="34" stroke="#5a3a18" stroke-width="0.5" opacity="0.4"/>

  <!-- 라벨 (큰 다크 박스) -->
  <rect x="16" y="36" width="32" height="22" rx="1" fill="url(#labelGrad)"/>

  <!-- 라벨 골드 테두리 라인 -->
  <line x1="18" y1="40" x2="46" y2="40" stroke="#e6c084" stroke-width="0.8"/>
  <line x1="18" y1="54" x2="46" y2="54" stroke="#e6c084" stroke-width="0.8"/>

  <!-- 라벨 중앙 텍스트 "여" -->
  <text x="32" y="51" font-family="Noto Sans KR, sans-serif" font-size="11" font-weight="900" fill="#e6c084" text-anchor="middle" letter-spacing="-0.5">여</text>

  <!-- 병 좌측 하이라이트 (입체감) -->
  <rect x="14" y="29" width="2" height="30" fill="#f5d49a" opacity="0.35" rx="1"/>

  <!-- 캡 상단 하이라이트 -->
  <rect x="27" y="3" width="2" height="6" fill="#5a4020" opacity="0.7"/>
</svg>
