<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#d4ad6a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d4ad6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6c084"/>
      <stop offset="50%" stop-color="#d4ad6a"/>
      <stop offset="100%" stop-color="#a8854a"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#d4ad6a" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)"/>

  <!-- Eyebrow tag -->
  <g transform="translate(80, 130)">
    <rect x="0" y="0" width="320" height="44" rx="22" fill="none" stroke="#a8854a" stroke-width="1.5"/>
    <text x="160" y="29" font-family="Noto Sans KR, sans-serif" font-size="16" font-weight="700" fill="#e6c084" text-anchor="middle" letter-spacing="2">YEOUIDO · 도보 3분</text>
  </g>

  <!-- Main title -->
  <text x="80" y="280" font-family="Noto Sans KR, sans-serif" font-size="88" font-weight="900" fill="#f6f1e6" letter-spacing="-4">여의도 착석바·토킹바</text>

  <!-- Brand line with gradient -->
  <text x="80" y="400" font-family="Noto Sans KR, sans-serif" font-size="112" font-weight="900" fill="url(#accentGrad)" letter-spacing="-5">여의도 라운지</text>

  <!-- Sub copy -->
  <text x="80" y="490" font-family="Noto Sans KR, sans-serif" font-size="32" font-weight="500" fill="#d9d3c4" letter-spacing="-1">프라이빗 룸에서 편안한 대화를</text>

  <!-- Footer info bar -->
  <line x1="80" y1="540" x2="1120" y2="540" stroke="#2d2c28" stroke-width="1"/>
  <g transform="translate(80, 580)" font-family="Noto Sans KR, sans-serif" font-size="22" font-weight="600" fill="#b3ad9e">
    <text x="0" y="0">매일 18:00 – 04:00</text>
    <text x="300" y="0">·</text>
    <text x="330" y="0">정식 사업자등록 매장</text>
    <text x="700" y="0">·</text>
    <text x="730" y="0">만 19세 이상</text>
  </g>

  <!-- Decorative dot -->
  <circle cx="1090" cy="150" r="6" fill="url(#accentGrad)"/>
  <circle cx="1090" cy="150" r="20" fill="none" stroke="url(#accentGrad)" stroke-width="1" opacity="0.4"/>
</svg>
